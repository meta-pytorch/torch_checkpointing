[build-system]
requires = ["setuptools>=42.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "torch_checkpointing"
version = "0.1.0"
description = "A high-performance, distributed-training-ready checkpointing library for PyTorch models"
readme = "README.md"
license = {text = "BSD-3-Clause"}
keywords = [
    "pytorch",
    "checkpointing",
    "distributed-training",
    "distributed-checkpointing"
]
requires-python = ">=3.9"
dependencies = [
    "torch>=2.6.0",
    "numpy",
    "typing_extensions>=4.6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "mypy>=1.5.0",
]
test = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["torch_checkpointing*"]
exclude = ["tests*"]

[tool.setuptools.package-data]
"torch_checkpointing" = ["py.typed"]


# Pyright type checker configuration
[tool.pyright]
include = ["torch_checkpointing", "tests"]
exclude = ["**/__pycache__", "**/.pytest_cache", "**/build", "**/dist", "**/*.egg-info"]
pythonVersion = "3.12"
pythonPlatform = "Linux"
typeCheckingMode = "basic"
useLibraryCodeForTypes = true
reportMissingImports = "warning"
reportMissingTypeStubs = "none"
reportUnusedImport = "warning"
reportUnusedVariable = "warning"
reportOptionalMemberAccess = "warning"
reportOptionalSubscript = "warning"
reportGeneralTypeIssues = "warning"
reportUnknownMemberType = "none"
reportUnknownVariableType = "none"
reportUnknownArgumentType = "none"
reportIncompatibleMethodOverride = "warning"

# pytest configuration
[tool.pytest.ini_options]
testpaths = ["tests"]
