[build-system]
requires = ["setuptools>=42.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "torch_checkpointing"
version = "0.1.0"
description = "A high-performance, distributed-training-ready checkpointing library for PyTorch models"
readme = "README.md"
license = {file = "LICENSE"}
authors = [
    {name = "Meta Platforms, Inc."},
]
keywords = [
    "pytorch",
    "checkpointing",
    "distributed-training",
    "distributed-checkpointing"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: BSD License",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.10"
dependencies = [
    "torch>=2.6.0",
    "numpy",
    "safetensors>=0.4.3",
    "typing_extensions>=4.6.0",
]

[project.urls]
Homepage = "https://github.com/meta-pytorch/torch_checkpointing"
Repository = "https://github.com/meta-pytorch/torch_checkpointing"
Issues = "https://github.com/meta-pytorch/torch_checkpointing/issues"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "expecttest",
    "black>=23.0.0",
    "isort>=5.12.0",
    "mypy>=1.5.0",
]
test = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "expecttest",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["torch_checkpointing*"]
exclude = ["tests*"]

[tool.setuptools.package-data]
"torch_checkpointing" = ["py.typed"]


# Pyright type checker configuration
[tool.pyright]
include = ["torch_checkpointing", "tests"]
exclude = ["**/__pycache__", "**/.pytest_cache", "**/build", "**/dist", "**/*.egg-info"]
pythonVersion = "3.12"
pythonPlatform = "Linux"
typeCheckingMode = "basic"
useLibraryCodeForTypes = true
reportMissingImports = "warning"
reportMissingTypeStubs = "none"
reportUnusedImport = "warning"
reportUnusedVariable = "warning"
reportOptionalMemberAccess = "warning"
reportOptionalSubscript = "warning"
reportGeneralTypeIssues = "warning"
reportUnknownMemberType = "none"
reportUnknownVariableType = "none"
reportUnknownArgumentType = "none"
reportIncompatibleMethodOverride = "warning"

# pytest configuration
[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
