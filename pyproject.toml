[build-system]
requires = ["uv_build>=0.9.7,<0.14"]
build-backend = "uv_build"

[project]
name = "torch_checkpointing"
version = "0.1.0"
description = "A high-performance, distributed-training-ready checkpointing library for PyTorch models"
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [
    {name = "Meta Platforms, Inc."},
]
keywords = [
    "pytorch",
    "checkpointing",
    "distributed-training",
    "distributed-checkpointing"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.11"
dependencies = [
    # 2.11 is the first release whose `torch.load(map_location="meta")` reads
    # only the headers of a file, which the offset-based reads rely on.
    "torch>=2.11.0",
    # The first numpy with Python 3.11 wheels.
    "numpy>=1.23.2",
    "safetensors>=0.4.3",
    "typing_extensions>=4.6.0",
]

[project.urls]
Homepage = "https://github.com/meta-pytorch/torch_checkpointing"
Repository = "https://github.com/meta-pytorch/torch_checkpointing"
Issues = "https://github.com/meta-pytorch/torch_checkpointing/issues"

[dependency-groups]
test = [
    "pytest>=8.0",
    # Parallel runs: `uv run pytest -n 8 --dist loadfile`.
    "pytest-xdist>=3.5",
    # Reports failures as annotations on GitHub Actions run pages; inactive elsewhere.
    "pytest-github-actions-annotate-failures>=0.3",
    # Both imported by torch.testing._internal.common_utils, which torch does
    # not declare as dependencies on every supported Python version.
    "expecttest>=0.2.1",
    "setuptools>=77.0.3",
]
# Pinned, so that every environment lints with the same rules.
lint = ["ruff==0.15.4"]
dev = [
    { include-group = "test" },
    { include-group = "lint" },
]
# Which torch build `uv sync` installs; pick one. `cuda` (the default) is the
# PyPI build, which is CUDA-enabled on Linux. `cpu` is the CPU-only build, for
# CI and machines without a GPU: `uv sync --no-group cuda --group cpu`.
cuda = ["torch>=2.11.0"]
cpu = ["torch>=2.11.0"]

[tool.uv]
required-version = ">=0.9.7"
default-groups = ["dev", "cuda"]
conflicts = [[{ group = "cpu" }, { group = "cuda" }]]
# Only resolve versions with wheels for these platforms. Without this, uv may
# pick a torch version from the CPU index that has wheels for macOS only.
required-environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'linux' and platform_machine == 'aarch64'",
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
]

[tool.uv.build-backend]
module-root = ""
source-include = ["tests/**"]

# Scoped to the `cpu` group, so it never applies when another project installs
# this one from git or a path. Published metadata depends on plain `torch`.
[tool.uv.sources]
torch = { index = "pytorch-cpu", group = "cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

# Pyright type checker configuration
[tool.pyright]
include = ["torch_checkpointing", "tests"]
exclude = ["**/__pycache__", "**/.pytest_cache", "**/build", "**/dist", "**/*.egg-info"]
pythonVersion = "3.12"
pythonPlatform = "Linux"
typeCheckingMode = "basic"
useLibraryCodeForTypes = true
reportMissingImports = "warning"
reportMissingTypeStubs = "none"
reportUnusedImport = "warning"
reportUnusedVariable = "warning"
reportOptionalMemberAccess = "warning"
reportOptionalSubscript = "warning"
reportGeneralTypeIssues = "warning"
reportUnknownMemberType = "none"
reportUnknownVariableType = "none"
reportUnknownArgumentType = "none"
reportIncompatibleMethodOverride = "warning"

# pytest configuration
[tool.pytest.ini_options]
testpaths = ["tests"]
# Tests that need GPUs declare how many. Each also skips itself when fewer are
# visible.
markers = [
    "gpus_needed_1: requires 1 GPU",
    "gpus_needed_2: requires 2 GPUs",
    "gpus_needed_4: requires 4 GPUs",
    "gpus_needed_8: requires 8 GPUs",
]

[tool.ruff]
target-version = "py311"
src = []

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.isort]
case-sensitive = false
combine-as-imports = true
order-by-type = false

[tool.test-selector.extra-deps]
