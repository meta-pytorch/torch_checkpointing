name: Build and publish torch_checkpointing release

# Manually-triggered release pipeline. torch_checkpointing is a pure-Python
# package, so we build a single universal sdist + wheel and publish via PyPI
# trusted publishing (no long-lived credentials).

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to stamp into pyproject.toml (e.g. 0.1.0rc1 or 0.1.0). Leave blank to publish the version already in pyproject.toml."
        required: false
        default: ""
      is_prerelease:
        description: "Is this a pre-release? (Marks the GitHub Release as a pre-release.)"
        type: boolean
        required: false
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Queue, don't cancel: a release must not be interrupted between the PyPI
  # upload and the GitHub Release, which would leave inconsistent state.
  cancel-in-progress: false

# Jobs that need more (publish, release) request it themselves.
permissions:
  contents: read

jobs:
  build:
    name: Build sdist and wheel
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v10
        with:
          python-version: "3.12"
          enable-cache: false

      - name: Stamp release version
        if: ${{ inputs.version != '' }}
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        # --frozen: update pyproject.toml only; uv.lock is not needed to build.
        run: uv version --frozen "$RELEASE_VERSION"

      - name: Build sdist and wheel
        run: |
          uv build
          uvx twine check --strict dist/*
          ls -la dist/

      - name: Resolve built version
        id: version
        run: echo "version=$(uv version --short --color never)" >> "$GITHUB_OUTPUT"

      - name: Smoke-test the wheel
        run: |
          uv venv --no-project "$RUNNER_TEMP/smoke"
          uv pip install --python "$RUNNER_TEMP/smoke" --torch-backend cpu dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/smoke/bin/python" -c "import torch_checkpointing as m; print('torch_checkpointing', m.__version__)"

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    # The environment must be configured as the trusted publisher for this
    # project on PyPI (https://docs.pypi.org/trusted-publishers/).
    environment: pypi
    permissions:
      id-token: write  # Required for PyPI trusted publishing
      contents: read
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      - name: Display structure of downloaded files
        run: ls -R dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          verbose: true

  release:
    name: Create GitHub release
    needs: [build, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Required to create the git tag and GitHub Release
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
          PRERELEASE: ${{ inputs.is_prerelease }}
        run: |
          args=(--title "v${VERSION}" --generate-notes)
          if [ "$PRERELEASE" = "true" ]; then
            args+=(--prerelease)
          fi
          gh release create "v${VERSION}" dist/* "${args[@]}"
